name: Build PaRappa2 Port

on:
  push:
    branches: [ main, master, android-port ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-pc-testforissues-windows:
    name: TestForIssues (Windows PC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        working-directory: port/pc
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
      - name: Build
        working-directory: port/pc
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: TestForIssues-windows
          path: |
            port/pc/build/TestForIssues.exe
            port/pc/build/TestForIssues_console.exe
          if-no-files-found: error

  build-pc-testforissues-linux:
    name: TestForIssues (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build
      - working-directory: port/pc
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: TestForIssues-linux
          path: port/pc/build/TestForIssues
          if-no-files-found: error
