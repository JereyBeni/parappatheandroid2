name: Build PaRappa2 Port

on:
  push:
    branches: [ main, master, android-port ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-pc-testforissues-windows:
    name: TestForIssues (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Activa el entorno de MSVC (cl.exe, link.exe, etc.)
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Ninja + MSVC)
        working-directory: port/pc
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Build TestForIssues
        working-directory: port/pc
        run: |
          cmake --build build --config Debug

      - name: Upload TestForIssues.exe
        uses: actions/upload-artifact@v4
        with:
          name: TestForIssues-windows
          path: |
            port/pc/build/TestForIssues.exe
            port/pc/build/Debug/TestForIssues.exe
          if-no-files-found: error

  build-pc-testforissues-linux:
    name: TestForIssues (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build

      - name: Configure
        working-directory: port/pc
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build TestForIssues
        working-directory: port/pc
        run: |
          cmake --build build

      - name: Upload TestForIssues binary
        uses: actions/upload-artifact@v4
        with:
          name: TestForIssues-linux
          path: port/pc/build/TestForIssues
          if-no-files-found: error
