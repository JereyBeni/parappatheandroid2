name: Build PaRappa2 Port

on:
  push:
    branches: [ main, master, android-port ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-pc-testforissues-windows:
    name: TestForIssues (Windows GUI)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Ninja + MSVC)
        working-directory: port/pc
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Build
        working-directory: port/pc
        run: |
          cmake --build build --config Release

      - name: List build output
        working-directory: port/pc/build
        run: |
          dir

      - name: Upload TestForIssues GUI + console
        uses: actions/upload-artifact@v4
        with:
          name: TestForIssues-windows
          path: |
            port/pc/build/TestForIssues.exe
            port/pc/build/TestForIssues_console.exe
          if-no-files-found: error

  build-pc-testforissues-linux:
    name: TestForIssues (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build

      - name: Configure
        working-directory: port/pc
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: port/pc
        run: |
          cmake --build build

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TestForIssues-linux
          path: port/pc/build/TestForIssues
          if-no-files-found: error
