name: Build PaRappa2 Port

on:
  push:
    branches: [ main, master, android-port ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =========================
  # PC Dev Build - TestForIssues (WINDOWS)
  # =========================
  build-pc-testforissues-windows:
    name: TestForIssues (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (MSVC)
        working-directory: port/pc
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Debug

      - name: Build TestForIssues
        working-directory: port/pc
        run: |
          cmake --build build --config Debug

      - name: Upload TestForIssues.exe
        uses: actions/upload-artifact@v4
        with:
          name: TestForIssues-windows
          path: port/pc/build/Debug/TestForIssues.exe
          if-no-files-found: error

  # =========================
  # PC Dev Build - TestForIssues (Linux opcional)
  # =========================
  build-pc-testforissues-linux:
    name: TestForIssues (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build

      - name: Configure
        working-directory: port/pc
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build TestForIssues
        working-directory: port/pc
        run: |
          cmake --build build

      - name: Upload TestForIssues binary
        uses: actions/upload-artifact@v4
        with:
          name: TestForIssues-linux
          path: port/pc/build/TestForIssues
          if-no-files-found: error

  # =========================
  # Android APK (debug) - scaffold
  # =========================
  build-android-apk:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Note
        run: |
          echo "Android APK scaffold is present under port/android/"
          echo "Full Gradle project generation is left for local expansion."
          echo "Native sources (rom_check + JNI) are ready."

      - name: Upload native sources as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-native-sources
          path: |
            port/android/
            port/common/
          if-no-files-found: ignore

  # =========================
  # Summary
  # =========================
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-pc-testforissues-windows, build-pc-testforissues-linux, build-android-apk]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## PaRappa2 Port Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **TestForIssues (Windows)**: TestForIssues.exe" >> $GITHUB_STEP_SUMMARY
          echo "- **TestForIssues (Linux)**: binario Linux opcional" >> $GITHUB_STEP_SUMMARY
          echo "- **Android**: native sources + scaffold" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ROM esperada: July 12 2001 NTSC-J Prototype" >> $GITHUB_STEP_SUMMARY
          echo "SHA1: 28964c33cee578ec3ce476285067044243363d08" >> $GITHUB_STEP_SUMMARY
